query Input {
  presentmentCurrencyRate
  cart {
    lines {
      id
      salePrice: attribute(key: "_Sale_Price") {
        value
      }
      shopCurrencyPrice: attribute(key: "_custom_price_shop") {
        value
      }
      legacyPrice: attribute(key: "_custom_price") {
        value
      }
    }
  }
}
